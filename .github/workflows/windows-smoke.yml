name: Windows Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: PowerShell smoke and config backup
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: PowerShell syntax check
        shell: powershell
        run: |
          $errors = @()
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw .\wincarry.ps1),
            [ref]$errors
          )

          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            exit 1
          }

      - name: CLI smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "WinCarry-CI"

          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 help
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 setup -Root $root -DryRun
          "YES" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 setup -Root $root
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 preflight -Root $root -DryRun
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 scan -Root $root -DryRun
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 manifest -Root $root -DryRun
          "YES" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 manifest -Root $root
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 report -Root $root -DryRun
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 restore -Root $root -DryRun
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 backup -Root $root -DryRun

      - name: Restore fixture tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-True {
            param(
              [Parameter(Mandatory = $true)]
              [bool]$Condition,

              [Parameter(Mandatory = $true)]
              [string]$Message
            )

            if (-not $Condition) {
              throw $Message
            }
          }

          $restoreRoot = Join-Path $env:RUNNER_TEMP "WinCarry-Restore-Fixture"
          Remove-Item -LiteralPath $restoreRoot -Recurse -Force -ErrorAction SilentlyContinue
          $targetProfile = Join-Path $restoreRoot "TargetProfile"
          $gitConfigBackup = Join-Path $restoreRoot "backups\fixture\configs\gitconfig"
          New-Item -ItemType Directory -Force -Path (Join-Path $restoreRoot "manifests"),(Join-Path $restoreRoot "reports"),(Join-Path $restoreRoot "logs"),(Join-Path $restoreRoot "apps\manual\Git"),$gitConfigBackup,$targetProfile | Out-Null
          Set-Content -LiteralPath (Join-Path $gitConfigBackup ".gitconfig") -Value "restored=true" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $targetProfile ".gitconfig") -Value "old=true" -Encoding UTF8
          $env:USERPROFILE = $targetProfile

          $manifest = [ordered]@{
            schemaVersion = "1.0"
            createdAt = (Get-Date).ToString("o")
            root = [ordered]@{ winCarryRoot = $restoreRoot }
            apps = @(
              [ordered]@{
                id = "app-git"
                name = "Git"
                classification = "Winget reinstallable"
                restoreConfidence = "Medium"
                restoreStrategy = "reinstall-via-package-manager"
                packages = @([ordered]@{ manager = "winget"; id = "Git.Git"; version = "2.42.0"; source = "winget" })
                configPaths = @([ordered]@{
                  type = "safe"
                  name = "Git global config"
                  originalPath = "C:\Users\Old\.gitconfig"
                  restorePathTemplate = "%USERPROFILE%\.gitconfig"
                  isDirectory = $false
                  backupPath = $gitConfigBackup
                  backupStatus = "backed_up"
                  warnings = @()
                })
              },
              [ordered]@{
                id = "app-fail"
                name = "Fail App"
                classification = "Winget reinstallable"
                restoreConfidence = "Medium"
                restoreStrategy = "reinstall-via-package-manager"
                packages = @([ordered]@{ manager = "winget"; id = "Fail.App"; version = "1.0"; source = "winget" })
                configPaths = @()
              },
              [ordered]@{
                id = "app-pseudo"
                name = "Pseudo package"
                classification = "Winget reinstallable"
                restoreConfidence = "Medium"
                restoreStrategy = "reinstall-via-package-manager"
                packages = @([ordered]@{ manager = "winget"; id = "MSIX\Pseudo.Package_1"; version = "1.0"; source = "" })
                configPaths = @()
              },
              [ordered]@{
                id = "app-scoop"
                name = "Scoop App"
                classification = "Scoop-managed"
                restoreConfidence = "High"
                restoreStrategy = "restore-via-scoop"
                packages = @([ordered]@{ manager = "scoop"; id = "ripgrep"; version = "13.0"; source = "" })
                configPaths = @()
              },
              [ordered]@{
                id = "app-manual"
                name = "Manual App"
                classification = "Unknown"
                restoreConfidence = "Unknown"
                restoreStrategy = "manual-review"
                packages = @()
                configPaths = @()
              }
            )
            manualReinstall = @([ordered]@{ name = "Manual App"; classification = "Unknown"; restoreConfidence = "Unknown"; restoreStrategy = "manual-review"; package = "manual" })
            unsupported = @()
            unmatchedConfigPaths = @()
          }
          Set-Content -LiteralPath (Join-Path $restoreRoot "manifests\latest.json") -Value ($manifest | ConvertTo-Json -Depth 12) -Encoding UTF8

          $dryRunOutput = @(powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 restore -Root $restoreRoot -DryRun 2>&1 | ForEach-Object { [string]$_ })
          $dryRunOutput | Write-Host
          $dryRunText = $dryRunOutput -join "`n"
          Assert-True ($dryRunText -match "Package-manager candidates: 3") "Dry-run restore should find three package-manager candidates."
          Assert-True ($dryRunText -match "Config Restore Plan") "Dry-run restore should show the config restore plan."
          Assert-True ($dryRunText -match "Existing config conflicts: 1") "Dry-run restore should detect existing config conflicts."
          Assert-True (-not (Get-ChildItem -LiteralPath (Join-Path $restoreRoot "reports") -Filter "restore-*.md" -ErrorAction SilentlyContinue)) "Dry-run restore should not write restore reports."

          $fakeBin = Join-Path $env:RUNNER_TEMP "WinCarry-FakeBin"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          $invocationPath = Join-Path $env:RUNNER_TEMP "wincarry-restore-invocations.txt"
          Remove-Item -LiteralPath $invocationPath -Force -ErrorAction SilentlyContinue
          $fakeWinget = Join-Path $fakeBin "winget.ps1"
          Set-Content -LiteralPath $fakeWinget -Encoding UTF8 -Value @'
          param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)

          if ($Arguments.Count -eq 1 -and $Arguments[0] -eq "--version") {
            Write-Output "v-test"
            exit 0
          }

          Add-Content -LiteralPath $env:WINCARRY_FAKE_WINGET_LOG -Value ($Arguments -join " ") -Encoding UTF8
          if (($Arguments -join " ") -match "Fail\.App") {
            exit 9
          }

          exit 0
          '@
          $env:WINCARRY_FAKE_WINGET_LOG = $invocationPath
          $env:PATH = "$fakeBin;$env:PATH"
          $wingetCommand = Get-Command winget -ErrorAction Stop
          Assert-True ([string]$wingetCommand.Source -eq [string]$fakeWinget) "Expected restore fixture to use fake winget at $fakeWinget, got $($wingetCommand.Source)."

          "3`n2`n1,2`nYES`n3`nYES`n" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 restore -Root $restoreRoot

          Assert-True (Test-Path -LiteralPath $invocationPath) "Expected fake winget invocation log."
          $invocations = Get-Content -Raw -LiteralPath $invocationPath
          Assert-True ($invocations -match "install --id Git\.Git") "Expected Git winget install command."
          Assert-True ($invocations -match "install --id Fail\.App") "Expected failing winget install command."
          Assert-True ($invocations -match "--version 2\.42\.0") "Expected detected version argument."
          Assert-True ($invocations -notmatch "MSIX") "Pseudo inventory IDs should not be installed."

          $restoreReport = Get-ChildItem -LiteralPath (Join-Path $restoreRoot "reports") -Filter "restore-*.md" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Assert-True ($null -ne $restoreReport) "Expected restore report after non-dry restore."
          $reportText = Get-Content -Raw -LiteralPath $restoreReport.FullName
          $restoredGitConfig = Get-Content -Raw -LiteralPath (Join-Path $targetProfile ".gitconfig")
          Assert-True ($restoredGitConfig -match "restored=true") "Expected Git config to be restored from backup."
          $existingBackup = Get-ChildItem -LiteralPath (Join-Path $restoreRoot "backups") -Recurse -Force -File -Filter ".gitconfig" | Where-Object { $_.FullName -match "existing-before-restore" } | Select-Object -First 1
          Assert-True ($null -ne $existingBackup) "Expected existing Git config to be backed up before replacement."
          $existingBackupText = Get-Content -Raw -LiteralPath $existingBackup.FullName
          Assert-True ($existingBackupText -match "old=true") "Existing config backup should preserve old content."
          Assert-True ($reportText -match "Successful commands: 1") "Restore report should record one successful command."
          Assert-True ($reportText -match "Failed commands: 1") "Restore report should record one failed command."
          Assert-True ($reportText -match "Restored configs: 1") "Restore report should record one restored config."
          Assert-True ($reportText -match "Git global config") "Restore report should include the restored config name."
          Assert-True ($reportText -match "Pseudo package") "Restore report should include skipped pseudo package."

      - name: Config backup fixture tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-True {
            param(
              [Parameter(Mandatory = $true)]
              [bool]$Condition,

              [Parameter(Mandatory = $true)]
              [string]$Message
            )

            if (-not $Condition) {
              throw $Message
            }
          }

          function New-FixtureProfile {
            param(
              [Parameter(Mandatory = $true)]
              [string]$BasePath
            )

            $profileRoot = Join-Path $BasePath "profile"
            $appData = Join-Path $BasePath "appdata"
            $localAppData = Join-Path $BasePath "localappdata"
            $programData = Join-Path $BasePath "programdata"

            New-Item -ItemType Directory -Force -Path (Join-Path $profileRoot ".ssh") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $profileRoot "Documents\PowerShell") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $appData "Code\User\Cache") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $appData "npm\etc") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $appData "discord") | Out-Null
            New-Item -ItemType Directory -Force -Path (Join-Path $localAppData "Microsoft\Edge\User Data") | Out-Null
            New-Item -ItemType Directory -Force -Path $programData | Out-Null

            Set-Content -LiteralPath (Join-Path $profileRoot ".gitconfig") -Value "[user]`n`tname = CI User" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $profileRoot ".npmrc") -Value "//registry.npmjs.org/:_authToken=secret" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $profileRoot ".ssh\config") -Value "Host example`n  HostName example.test" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $profileRoot ".ssh\id_ed25519") -Value "PRIVATE KEY" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $profileRoot "Documents\PowerShell\Microsoft.PowerShell_profile.ps1") -Value "Write-Host profile" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $appData "Code\User\settings.json") -Value '{"editor.tabSize":2}' -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $appData "Code\User\.env") -Value "SECRET=1" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $appData "Code\User\Cache\cache.tmp") -Value "cache" -Encoding UTF8
            Set-Content -LiteralPath (Join-Path $appData "npm\etc\npmrc") -Value "registry=https://registry.npmjs.org/" -Encoding UTF8

            $env:USERPROFILE = $profileRoot
            $env:HOME = $profileRoot
            $env:APPDATA = $appData
            $env:LOCALAPPDATA = $localAppData
            $env:PROGRAMDATA = $programData
          }

          function Read-BackupMetadata {
            param(
              [Parameter(Mandatory = $true)]
              [string]$RootPath
            )

            $path = Join-Path $RootPath "backups\latest-config-backup.json"
            Assert-True (Test-Path -LiteralPath $path) "Expected latest config backup metadata at $path"
            return (Get-Content -Raw -LiteralPath $path | ConvertFrom-Json)
          }

          $fixtureBase = Join-Path $env:RUNNER_TEMP "WinCarry-Fixture"
          New-FixtureProfile -BasePath $fixtureBase

          $dryRoot = Join-Path $env:RUNNER_TEMP "WinCarry-Backup-DryRun"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 backup -Root $dryRoot -DryRun
          Assert-True (-not (Test-Path -LiteralPath $dryRoot)) "Dry-run backup should not create the root folder."

          $defaultRoot = Join-Path $env:RUNNER_TEMP "WinCarry-Backup-Default"
          "`nYES`n" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 backup -Root $defaultRoot
          $defaultBackup = Read-BackupMetadata -RootPath $defaultRoot
          $defaultBackupRoot = [string]$defaultBackup.backupRoot

          Assert-True ([int]$defaultBackup.summary.backedUp -ge 5) "Expected safe configs to be backed up by default."
          Assert-True ([int]$defaultBackup.summary.skippedSensitive -ge 2) "Expected sensitive configs to be skipped by default."
          Assert-True ([int]$defaultBackup.summary.detectOnly -ge 2) "Expected browser/chat profiles to be detect-only."
          Assert-True (-not [bool]$defaultBackup.includeSensitive) "Default backup should not include sensitive files."

          Assert-True (-not (Test-Path -LiteralPath (Join-Path $defaultBackupRoot "configs\npmrc\.npmrc"))) "Default backup copied .npmrc."
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $defaultBackupRoot "configs\ssh-private-key-id_ed25519\id_ed25519"))) "Default backup copied SSH private key."
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $defaultBackupRoot "configs\vscode-user\.env"))) "Default backup copied nested .env."
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $defaultBackupRoot "configs\vscode-user\Cache\cache.tmp"))) "Default backup copied cache file."
          Assert-True (Test-Path -LiteralPath (Join-Path $defaultRoot "reports")) "Expected backup report folder."

          $includeRoot = Join-Path $env:RUNNER_TEMP "WinCarry-Backup-Include"
          "INCLUDE`nYES`n" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 backup -Root $includeRoot
          $includeBackup = Read-BackupMetadata -RootPath $includeRoot
          $includeBackupRoot = [string]$includeBackup.backupRoot

          Assert-True ([bool]$includeBackup.includeSensitive) "INCLUDE backup should mark includeSensitive true."
          Assert-True ([int]$includeBackup.summary.skippedSensitive -eq 0) "INCLUDE backup should not skip sensitive candidates."
          Assert-True (Test-Path -LiteralPath (Join-Path $includeBackupRoot "configs\npmrc\.npmrc")) "INCLUDE backup did not copy .npmrc."
          Assert-True (Test-Path -LiteralPath (Join-Path $includeBackupRoot "configs\ssh-private-key-id_ed25519\id_ed25519")) "INCLUDE backup did not copy SSH private key."
          Assert-True (Test-Path -LiteralPath (Join-Path $includeBackupRoot "configs\vscode-user\.env")) "INCLUDE backup did not copy nested .env."
          Assert-True (-not (Test-Path -LiteralPath (Join-Path $includeBackupRoot "configs\vscode-user\Cache\cache.tmp"))) "INCLUDE backup copied cache file."

          $mergeRoot = Join-Path $env:RUNNER_TEMP "WinCarry-Backup-Merge"
          New-Item -ItemType Directory -Force -Path (Join-Path $mergeRoot "manifests") | Out-Null
          $syntheticManifest = [ordered]@{
            schemaVersion = "1.0"
            apps = @(
              [ordered]@{ name = "Git"; configPaths = @() },
              [ordered]@{ name = "K-Lite Mega Codec Pack"; configPaths = @([ordered]@{ name = "VS Code User Settings"; originalPath = "stale-vscode" }) },
              [ordered]@{ name = "Anaconda Powershell Prompt"; configPaths = @([ordered]@{ name = "PowerShell WindowsPowerShell all-hosts profile"; originalPath = "stale-powershell" }) },
              [ordered]@{ name = "Microsoft Visual Studio Code (User)"; configPaths = @() },
              [ordered]@{ name = "PowerShell 7"; configPaths = @() }
            )
            configBackups = @()
            unmatchedConfigPaths = @()
          }
          Set-Content -LiteralPath (Join-Path $mergeRoot "manifests\latest.json") -Value ($syntheticManifest | ConvertTo-Json -Depth 8) -Encoding UTF8

          "`nYES`n" | powershell -NoProfile -ExecutionPolicy Bypass -File .\wincarry.ps1 backup -Root $mergeRoot
          $mergedManifest = Get-Content -Raw -LiteralPath (Join-Path $mergeRoot "manifests\latest.json") | ConvertFrom-Json
          $gitApp = $mergedManifest.apps | Where-Object { $_.name -eq "Git" } | Select-Object -First 1
          $codecApp = $mergedManifest.apps | Where-Object { $_.name -eq "K-Lite Mega Codec Pack" } | Select-Object -First 1
          $anacondaPromptApp = $mergedManifest.apps | Where-Object { $_.name -eq "Anaconda Powershell Prompt" } | Select-Object -First 1
          $codeApp = $mergedManifest.apps | Where-Object { $_.name -eq "Microsoft Visual Studio Code (User)" } | Select-Object -First 1
          $psApp = $mergedManifest.apps | Where-Object { $_.name -eq "PowerShell 7" } | Select-Object -First 1

          Assert-True (@($mergedManifest.configBackups).Count -eq 1) "Expected config backup summary in latest manifest."
          Assert-True (@($gitApp.configPaths).Count -ge 1) "Expected Git config paths in latest manifest."
          Assert-True (@($codecApp.configPaths).Count -eq 0) "Codec app should not receive VS Code config paths."
          Assert-True (@($anacondaPromptApp.configPaths).Count -eq 0) "Anaconda PowerShell prompt should not receive PowerShell profile config paths."
          Assert-True (@($codeApp.configPaths).Count -ge 1) "Expected VS Code config paths in latest manifest."
          Assert-True (@($psApp.configPaths).Count -ge 1) "Expected PowerShell config paths in latest manifest."
          Assert-True (@($codeApp.configPaths | Where-Object { $_.appName -eq "Visual Studio Code" }).Count -ge 1) "Expected VS Code config path to retain intended app metadata."
